<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiNozzle — nozzle design &amp; validation copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
/* OptiNozzle - dark engineering console.
   Visual language carried over from the original optinozzle.html:
   engineering grid, ice/amber accents, Space Grotesk numerals. */
:root {
  --bg: #0b1017;
  --panel: #121a24;
  --panel-2: #0e151e;
  --panel-3: #0f1720;
  --line: #22303f;
  --line-soft: #1a2531;
  --ink: #e8eef4;
  --ink-dim: #8ba0b3;
  --ink-faint: #5a6f82;
  --ice: #4fd3e8;
  --ice-deep: #2a9fb8;
  --amber: #f0a742;
  --amber-deep: #c77d1e;
  --ok: #5fcf8e;
  --warn: #e8935f;
  --bad: #e0655f;
  --violet: #9b8cf0;
  --radius: 10px;
  --mono: 'Space Grotesk', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  min-height: 100vh;
  background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 44px 44px;
  background-position: center top;
}
.wrap { max-width: 1560px; margin: 0 auto; padding: 20px 20px 64px; }
h1, h2, h3, h4, .num { font-family: var(--mono); }

/* ---- header ---- */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
.brand h1 .opti { color: var(--ice); }
.brand .tagline { color: var(--ink-dim); font-size: 13px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 100px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 7px; background: var(--panel-2); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; color: var(--ink-dim); font-family: var(--mono); font-size: 12px; padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed='true'] { background: var(--ice); color: #06202a; font-weight: 600; }
button.act { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: var(--mono); }
button.act:hover { border-color: var(--ice-deep); color: var(--ice); }
button.act.primary { background: linear-gradient(180deg, #1d5b6b, #16414e); border-color: var(--ice-deep); color: #dffaff; }
button.act.primary:hover { background: linear-gradient(180deg, #24707f, #1a4d5c); }
button.act:disabled { opacity: .45; cursor: not-allowed; }

/* ---- design intent bar ---- */
.intent { margin: 16px 0 14px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(180deg, #14202c, var(--panel-2)); padding: 14px 16px; }
.intent .lab { font-family: var(--mono); font-size: 12px; letter-spacing: .09em; color: var(--amber); margin-bottom: 9px; }
.intent .row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.intent input[type='text'] { flex: 1 1 420px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 10px 12px; font-size: 14px; font-family: inherit; }
.intent input[type='text']:focus { outline: none; border-color: var(--ice-deep); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { background: var(--panel-3); border: 1px solid var(--line-soft); color: var(--ink-dim); border-radius: 100px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { border-color: var(--ice-deep); color: var(--ice); }
.intent-summary { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--ink-dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---- tabs ---- */
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-faint); font-family: var(--mono); font-size: 13px; letter-spacing: .06em; padding: 9px 14px; cursor: pointer; }
nav.tabs button:hover { color: var(--ink-dim); }
nav.tabs button[aria-selected='true'] { color: var(--ice); border-bottom-color: var(--ice); }

/* ---- layout ---- */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .workspace { grid-template-columns: 1fr; } }
.cols2 { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.cols2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .cols2, .cols2.even { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 16px; }

.panel { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.panel > h2 { font-weight: 600; font-size: 12.5px; letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; }
.panel > .sub { color: var(--ink-faint); font-size: 12.5px; margin: 4px 0 14px; }
.panel h3 { font-size: 12.5px; color: var(--ink-dim); margin: 16px 0 8px; letter-spacing: .04em; }
.panel h3:first-child { margin-top: 0; }

/* ---- metric cards ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; }
.card { background: var(--panel-3); border: 1px solid var(--line-soft); border-radius: 9px; padding: 12px 13px; position: relative; }
.card .k { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.card .v { font-family: var(--mono); font-weight: 700; font-size: 26px; line-height: 1.08; letter-spacing: -.02em; color: var(--ink); }
.card .v u { text-decoration: none; font-size: 13px; font-weight: 500; color: var(--ink-faint); margin-left: 4px; }
.card.hero .v { font-size: 34px; color: var(--ice); }
.card .pm { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 5px; }
.card .eq { font-size: 11px; color: var(--ink-faint); margin-top: 6px; font-family: var(--mono); }
.card .tags { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }

/* ---- badges ---- */
.tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.tag.cfd { color: var(--ice); border-color: #23555f; background: #10323a55; }
.tag.analytical { color: var(--amber); border-color: #5d4422; background: #3a2a1055; }
.tag.derived { color: var(--violet); border-color: #443d72; background: #241f4455; }
.tag.outside { color: var(--warn); border-color: #6b3f2a; background: #40221255; }
.tag.input { color: var(--ink-faint); border-color: var(--line); }
.badge { font-family: var(--mono); font-size: 11px; letter-spacing: .07em; padding: 4px 9px; border-radius: 5px; border: 1px solid; display: inline-flex; align-items: center; gap: 6px; }
.badge.VALIDATED { color: var(--ok); border-color: #2e6a49; background: #10301f66; }
.badge.LIMITED { color: var(--amber); border-color: #6b5222; background: #3a2c1066; }
.badge.EXTRAPOLATION { color: var(--warn); border-color: #6b3f2a; background: #40221266; }
.badge.UNSUPPORTED { color: var(--violet); border-color: #443d72; background: #241f4466; }
.badge.INVALID, .badge.ERROR { color: var(--bad); border-color: #6d3330; background: #3a191866; }
.badge.NO_FEASIBLE, .badge.NO_OBJECTIVE { color: var(--ink-dim); border-color: var(--line); }
.dotc { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dotc.VALIDATED { background: var(--ok); } .dotc.LIMITED { background: var(--amber); }
.dotc.EXTRAPOLATION { background: var(--warn); } .dotc.INVALID { background: var(--bad); }
.dotc.UNSUPPORTED { background: var(--violet); }

/* ---- controls ---- */
.ctrl { margin-bottom: 13px; }
.ctrl:last-child { margin-bottom: 0; }
.ctrl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.ctrl label { font-size: 13px; color: var(--ink); }
.ctrl .hint { color: var(--ink-faint); font-size: 11px; }
input[type='number'], input[type='text'].f, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--ink); padding: 7px 9px; font-family: var(--mono); font-size: 13.5px; }
input[type='number']:focus, select:focus, input[type='text'].f:focus { outline: none; border-color: var(--ice-deep); }
input[type='number']:disabled { color: var(--ink-faint); background: var(--panel-2); }
.unit-in { display: flex; align-items: center; gap: 7px; }
.unit-in .u { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); min-width: 34px; }
input[type='range'] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: var(--line); outline: none; margin-top: 8px; }
input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ice); cursor: pointer; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--ice-deep); }
input[type='range']::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--ice); cursor: pointer; border: 2px solid var(--bg); }
input[type='range'].amber::-webkit-slider-thumb { background: var(--amber); box-shadow: 0 0 0 1px var(--amber-deep); }
.rangelabels { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 10.5px; margin-top: 3px; font-family: var(--mono); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; }

/* ---- tables ---- */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.scroll-x { overflow-x: auto; }
/* text wraps by default so long notes are never clipped; numbers never wrap */
th, td { text-align: right; padding: 6px 9px; border-bottom: 1px solid var(--line-soft); white-space: normal; vertical-align: top; }
td.num, th.num, td.n { white-space: nowrap; }
th { color: var(--ink-faint); font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
td:first-child, th:first-child { text-align: left; }
td.num, td .num { font-family: var(--mono); }
tbody tr:hover { background: #ffffff06; }
tr.sel { background: #4fd3e814; }
tr.click { cursor: pointer; }
td.good { color: var(--ok); } td.bad { color: var(--bad); } td.dim { color: var(--ink-faint); }
/* long free-text cells (equations, notes) wrap instead of forcing a scroll */
td.wrap, th.wrap { white-space: normal; min-width: 120px; text-align: left; }
th.raw { text-transform: none; }

/* ---- notes / warnings ---- */
.note { font-size: 12.5px; border-radius: 8px; padding: 9px 12px; border: 1px solid; margin-top: 10px; line-height: 1.5; }
.note.info { color: var(--ink-dim); border-color: var(--line); background: #ffffff05; }
.note.limited { color: #f3c98b; border-color: #6b5222; background: #3a2c1033; }
.note.extrapolation { color: #f0b191; border-color: #6b3f2a; background: #40221233; }
.note.unsupported { color: #c3b8f5; border-color: #443d72; background: #241f4433; }
.note.error { color: #f0a7a2; border-color: #6d3330; background: #3a191833; }
.note.ok { color: #a5e3c1; border-color: #2e6a49; background: #10301f33; }
.note b { font-weight: 600; }
ul.bul { margin: 8px 0 0 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-dim); }
ul.bul li { margin-bottom: 5px; line-height: 1.5; }
ul.bul.tight li { margin-bottom: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-faint); }
.kv dd { color: var(--ink-dim); font-family: var(--mono); word-break: break-word; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono); }
summary:hover { color: var(--ice); }
.mini { font-size: 11.5px; color: var(--ink-faint); }
code { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); background: #ffffff08; padding: 1px 5px; border-radius: 4px; }

/* ---- trust rail ---- */
.rail { position: sticky; top: 14px; display: grid; gap: 14px; }
@media (max-width: 1180px) { .rail { position: static; } }
.check { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
.check:last-child { border-bottom: 0; }
.check .mark { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
.check .mark.ok { background: var(--ok); } .check .mark.info { background: var(--ice-deep); }
.check .mark.limited { background: var(--amber); } .check .mark.extrapolation { background: var(--warn); }
.check .mark.error { background: var(--bad); }
.check .t { color: var(--ink); }
.check .val { color: var(--ink-dim); font-family: var(--mono); font-size: 11.5px; }
.check .m { color: var(--ink-faint); font-size: 11.5px; margin-top: 2px; line-height: 1.45; }

/* ---- plots ---- */
svg.plot { height: auto; display: block; margin: 0 auto; }
.plot .axis { stroke: var(--line); stroke-width: 1; }
.plot .grid { stroke: var(--line-soft); stroke-width: 1; }
.plot text { fill: var(--ink-faint); font-family: var(--mono); font-size: 10px; }
.plot text.axis-title { fill: var(--ink-dim); font-size: 11px; }
.plot .band2 { fill: #4fd3e8; opacity: .10; }
.plot .band1 { fill: #4fd3e8; opacity: .18; }
.plot .line-gpr { fill: none; stroke: var(--ice); stroke-width: 2; }
.plot .line-alt { fill: none; stroke: var(--amber); stroke-width: 1.6; }
.plot .line-dash { fill: none; stroke: var(--ink-faint); stroke-width: 1.2; stroke-dasharray: 4 4; }
.plot .pt-cfd { fill: #dce9f2; stroke: #0b1017; stroke-width: 1; }
.plot .pt-loo { fill: none; stroke: var(--amber); stroke-width: 1.5; }
.plot .pt-alt { fill: var(--violet); }
.plot .cur { fill: var(--amber); stroke: #0b1017; stroke-width: 1; }
.plot .region { fill: #e8935f; opacity: .07; }
.plot .region-line { stroke: #6b3f2a; stroke-dasharray: 3 4; }
.plot .front { fill: none; stroke: var(--ok); stroke-width: 1.8; }
.plot .pt-dim { fill: var(--ink-faint); opacity: .5; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* ---- nozzle view ---- */
.nozzle-holder { background: var(--panel-3); border: 1px solid var(--line-soft); border-radius: 9px; padding: 8px; }
.nozzle-dims { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 8px; }
.nozzle-dims b { color: var(--ice); font-weight: 600; }

/* ---- candidates ---- */
.cand-labels { display: flex; gap: 4px; flex-wrap: wrap; }
.lbl { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #ffffff0c; color: var(--ink-dim); border: 1px solid var(--line-soft); }
.lbl.rec { background: #10323a; color: var(--ice); border-color: #23555f; }
.delta-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
.delta { background: var(--panel-3); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; }
.delta .k { font-size: 11px; color: var(--ink-faint); }
.delta .v { font-family: var(--mono); font-size: 18px; font-weight: 600; margin-top: 3px; }
.delta .v.up { color: var(--ok); } .delta .v.down { color: var(--warn); } .delta .v.flat { color: var(--ink-dim); }
.delta .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 7px; position: relative; overflow: hidden; }
.delta .bar i { position: absolute; top: 0; bottom: 0; background: var(--ice); }

footer.bot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 12px; line-height: 1.6; }
footer.bot b { color: var(--ink-dim); font-weight: 500; }
#boot-error { display: none; margin: 24px 0; }
.spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--ice); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="opti">Opti</span>Nozzle</h1>
      <span class="tagline">nozzle design &amp; validation copilot</span>
    </div>
    <div class="top-right">
      <span class="pill" id="engine-pill"><span class="dot"></span><span id="engine-label">loading…</span></span>
      <span class="seg" role="group" aria-label="Units">
        <button type="button" data-units="SI" aria-pressed="true">SI</button>
        <button type="button" data-units="US" aria-pressed="false">US</button>
      </span>
      <button class="act" type="button" id="btn-report">Export report</button>
    </div>
  </header>

  <div id="notices"></div>

  <section class="intent" id="intent-bar" hidden>
    <div class="lab">DESIGN INTENT</div>
    <div class="row">
      <input type="text" id="intent-text" placeholder="Describe what you want this nozzle to achieve…" autocomplete="off">
      <button class="act primary" type="button" id="intent-run">Interpret</button>
      <button class="act" type="button" id="intent-clear">Clear</button>
    </div>
    <div class="chips" id="intent-chips"></div>
    <div class="intent-summary" id="intent-summary" hidden></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" hidden></nav>

  <div class="workspace" id="workspace" hidden>
    <main id="tab-root"></main>
    <aside class="rail" id="rail"></aside>
  </div>

  <div id="boot-error"></div>

  <footer class="bot" id="footer">
    <b>Loading…</b>
  </footer>
</div>
<script>

    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `optinozzle-assessment-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

    const g = e.target.closest('[data-goto]');
    if (g) api.setTab(g.dataset.goto);
  });

  if (store.get().intent.text) api.runIntent(store.get().intent.text);
}

window.addEventListener('unhandledrejection', (e) => fatal('Unexpected error', e.reason?.message ?? String(e.reason)));
boot().catch((e) => {
  console.error(e);

__defs['models/cf/epsModel.js'] = function (__exp, __req, __exp$assign) {
// Cf_vac(eps) surrogate - trained by train_eps_surrogate.py on the
// expansion-ratio sweep (eps_sweep_entry.xlsx). CFD values come from the
// bundle; nothing here is hard-coded.
const { GaussianProcess } = __req('models/gp.js');

const median = (a) => {
  const s = [...a].sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : 0.5 * (s[m - 1] + s[m]);
};

class CfExpansionRatioModel {
  constructor(entry) {
    this.id = 'cf_expansion_ratio';
    this.entry = entry;
    this.gp = new GaussianProcess(entry.model.gp);
    this.logInput = entry.model.input_transform === 'log';
    this.range = entry.model.eps_range;
    this.dataset = entry.dataset;
    this.cases = entry.dataset.cases
      .filter((c) => c.eps != null && c.Cf_vac != null)
      .sort((a, b) => a.eps - b.eps);
    const fs = entry.dataset.fixed_shape;
    this.fixedShape = {
      percentBell: fs.percent_bell[0],
      thetaN: fs.theta_n_deg[0],
      thetaE: fs.theta_e_deg[0],
    };
    this.operatingCondition = entry.dataset.operating_condition; // {Pc_Pa, At_m2, Pamb_Pa}
    // the model's own typical in-domain sigma (median over the CFD points)
    this.sigmaTypical = median(this.cases.map((c) => this.predict(c.eps).sigma));
  }

  /** GPR prediction of Cf_vac at expansion ratio eps. */
  predict(eps) {
    const x = this.logInput ? Math.log(eps) : eps;
    const { mean, sigma } = this.gp.predict([x]);
    return { mean, sigma, inDomain: eps >= this.range[0] && eps <= this.range[1] };
  }

  /** The CFD cases bracketing eps (or the two nearest, outside the data). */
  nearest(eps, k = 2) {
    const cs = this.cases;
    let picks = [];
    const below = cs.filter((c) => c.eps <= eps).pop();
    const above = cs.find((c) => c.eps >= eps);
    if (below) picks.push(below);
    if (above && above !== below) picks.push(above);
    if (picks.length < k) {
      picks = [...cs].sort((a, b) => Math.abs(Math.log(a.eps / eps)) - Math.abs(Math.log(b.eps / eps))).slice(0, k);
      picks.sort((a, b) => a.eps - b.eps);
    }
    return picks.map((c) => ({
      source: 'CFD result',
      dataset: this.dataset.file,
      run_id: c.run_id,
      eps: c.eps,
      Cf_vac: c.Cf_vac,
      d_eps: c.eps - eps,
      d_log_eps: Math.log(c.eps / eps),
    }));
  }

  /** Smallest |ln(eps/eps_i)| over the CFD cases - distance to data. */
  logDistance(eps) {
    return Math.min(...this.cases.map((c) => Math.abs(Math.log(c.eps / eps))));
  }

  provenance() {
    const m = this.entry.model;
    return {
      model: this.id,
      kind: 'Gaussian-process regression',
      config: m.config,
      kernel: m.gp.kernel.repr,
      artefact: m.artefact,
      script: m.script,
      trainingDataset: this.dataset.file,
      sha256: this.dataset.sha256,
      trainingCases: m.n_train,
      target: 'Cf_vac',
      input: `eps (${m.input_transform})`,
      solver: this.dataset.solver,
      operatingCondition: this.operatingCondition,
      geometry: this.fixedShape,
    };
  }
}

__exp$assign({ CfExpansionRatioModel });

__defs['models/cf/shapeModel.js'] = function (__exp, __req, __exp$assign) {
// Cf(shape) surrogate - trained by train_surrogate.py on the shape sweep
// (nozzle_sweep_entry_constant_e.xlsx) at a single eps.
//
// Its own leave-one-out validation says it does NOT beat predicting the mean,
// so the app never uses it to rank or optimise shapes for Cf. It is exposed
// for transparency (with confidence 'low') next to the best-supported
// estimate, which on this data is simply the sweep mean.
const { GaussianProcess } = __req('models/gp.js');

const KEYS = ['percent_bell', 'theta_n_deg', 'theta_e_deg'];

class CfShapeModel {
  constructor(entry) {
    this.id = 'cf_shape';
    this.entry = entry;
    this.gp = new GaussianProcess(entry.model.gp);
    this.dataset = entry.dataset;
    this.box = entry.dataset.box;
    this.stats = entry.dataset.cf_stats;
    this.cases = entry.dataset.cases.filter((c) => c.Cf != null);
    this.trainCases = this.cases.filter((c) => c.in_training);
    this.eps = [...new Set(entry.dataset.cases.map((c) => c.eps).filter((e) => e != null))];
    this.operatingCondition = entry.dataset.operating_condition;
    const tab = entry.validation.table;
    this.gprMetrics = tab.find((r) => r.model === 'GPR');
    this.dummyMetrics = tab.find((r) => r.model.startsWith('Dummy'));
    this.beatsMean = this.gprMetrics.rmse < this.dummyMetrics.rmse;
  }

  /** Low-confidence GPR prediction. */
  predict(percentBell, thetaN, thetaE) {
    const { mean, sigma } = this.gp.predict([percentBell, thetaN, thetaE]);
    return { mean, sigma, inBox: this.inBox(percentBell, thetaN, thetaE), confidence: 'low' };
  }

  /** The estimate the validation actually supports: the CFD sweep mean. */
  bestEstimate() {
    return {
      mean: this.stats.mean,
      sigma: this.stats.std,
      method: `mean of the ${this.trainCases.length} shape-sweep CFD results (the mean-predictor beats the GPR in leave-one-out CV)`,
    };
  }

  inBox(pb, tn, te) {
    const v = [pb, tn, te];
    return KEYS.every((k, i) => v[i] >= this.box[k][0] - 1e-9 && v[i] <= this.box[k][1] + 1e-9);
  }

  _dist(c, v) {
    let s = 0;
    KEYS.forEach((k, i) => {
      const span = this.box[k][1] - this.box[k][0] || 1;
      s += ((c[k] - v[i]) / span) ** 2;
    });
    return Math.sqrt(s);
  }

  /** Nearest CFD runs in range-normalised (percent_bell, theta_n, theta_e). */
  nearest(pb, tn, te, k = 3) {
    const v = [pb, tn, te];
    return this.cases
      .map((c) => ({
        source: 'CFD result',
        dataset: this.dataset.file,
        run_id: c.run_id,
        role: c.role,
        percent_bell: c.percent_bell,
        theta_n_deg: c.theta_n_deg,
        theta_e_deg: c.theta_e_deg,
        eps: c.eps,
        Cf: c.Cf,
        Pamb_Pa: this.operatingCondition.Pamb_Pa,
        distance: this._dist(c, v),
      }))
      .sort((a, b) => a.distance - b.distance)
      .slice(0, k);
  }

  nearestDistance(pb, tn, te) {
    return Math.min(...this.cases.map((c) => this._dist(c, [pb, tn, te])));
  }

  provenance() {
    const m = this.entry.model;
    return {
      model: this.id,
      kind: 'Gaussian-process regression (ARD Matern)',
      kernel: m.gp.kernel.repr,
      artefact: m.artefact,
      script: m.script,
      trainingDataset: this.dataset.file,
      sha256: this.dataset.sha256,
      trainingCases: m.n_train,
      target: 'Cf (at Pamb of the workbook)',
      inputs: m.features,
      confidence: 'low',
      operatingCondition: this.operatingCondition,
    };
  }
}

__exp$assign({ CfShapeModel });

// Training-domain assessment and release status.
//
// Every rule is explicit and exported (RULES) so the VALIDATE tab can show
// exactly how a status was reached - no opaque confidence score.
const { fmt } = __req('engine/format.js');

const RULES = {
  PC_REL_TOL: 0.01, // Pc within 1% of the CFD chamber pressure
  AT_REL_TOL: 0.01, // throat area within 1% of the CFD throat
  GAMMA_REL_TOL: 0.005, // gamma within 0.5% of the project CEA basis
  SHAPE_TOL: { percentBell: 0.005, thetaN: 0.1, thetaE: 0.1 },
  SIGMA_ELEVATED: 1.25, // GPR sigma > 1.25x its typical in-domain value -> LIMITED
  SUMMERFIELD: 0.4, // Pe/Pa below this -> separation likely
};

const STATUS = {
  VALIDATED: { id: 'VALIDATED', text: 'Prediction lies inside the validated CFD domain.' },
  LIMITED: { id: 'LIMITED', text: 'Prediction is supported, but uncertainty is elevated or the evidence is indirect.' },
  EXTRAPOLATION: { id: 'EXTRAPOLATION', text: 'Requested condition lies outside the current CFD training domain.' },
  UNSUPPORTED: { id: 'UNSUPPORTED', text: 'No validated surrogate exists for this requested quantity.' },
  INVALID: { id: 'INVALID', text: 'The geometry or inputs are not physically realisable.' },
};

const RANK = { ok: 0, info: 0, limited: 1, extrapolation: 2, error: 3 };
const rel = (a, b) => Math.abs(a - b) / Math.abs(b);

function assessDomain(inp, ctx, { withNearest = true } = {}) {

  const sm = ctx.shapeModel;
  const oc = em.operatingCondition;
  const [e0, e1] = em.range;
  const checks = [];
  const add = (id, label, state, value, reference, message) => checks.push({ id, label, state, value, reference, message });

  const bell = inp.dims.bell;
  const shapeStr = `${(inp.percentBell * 100).toFixed(1)}% · ${inp.thetaN.toFixed(1)}° · ${inp.thetaE.toFixed(1)}°`;
  if (!(inp.thetaN > inp.thetaE)) {
    add('geometry', 'Bell geometry', 'error', shapeStr, 'θn > θe', 'θn must exceed θe: the bell has to turn the flow back toward the axis.');
  } else if (!bell.monotone) {
    add('geometry', 'Bell geometry', 'error', shapeStr, 'monotone x(s)',
      'The bell folds back on itself (exit upstream of the throat arc, or control point outside N..E). nozzle_contour.py raises ValueError for this shape.');
  } else if (bell.clamped) {
    add('geometry', 'Bell geometry', 'limited', `θe realised ${bell.thetaERealised.toFixed(2)}°`, `θe requested ${inp.thetaE.toFixed(2)}°`,
      `Chord angle ${bell.chordDeg.toFixed(2)}° is not between θe and θn, so the Bézier control point was clamped (as nozzle_contour.py does) and the realised exit angle differs from θe. make_sweep_plan.py avoids this region.`);
  } else {
    add('geometry', 'Bell geometry', 'ok', `chord ${bell.chordDeg.toFixed(2)}°`, 'θe < chord < θn', 'Realisable bell: θe < chord angle < θn.');
  }

  // ---- expansion ratio -----------------------------------------------------
  if (inp.eps >= e0 && inp.eps <= e1) {
    add('eps_range', 'Expansion ratio ε', 'ok', fmt.eps(inp.eps), `${e0}–${e1} (CFD)`, `Inside the CFD training range (${em.cases.length} Fluent cases).`);

    add('eps_range', 'Expansion ratio ε', 'extrapolation', fmt.eps(inp.eps), `${e0}–${e1} (CFD)`,

// Evaluates a Gaussian-process posterior exported by
// backend/build_model_bundle.py from the trained scikit-learn model.
//
// The bundle carries the full fitted state (kernel hyper-parameters, scaled
// training inputs, alpha = K^-1 y, the Cholesky factor L and the
// y-normalisation), so this reproduces sklearn's

// Nothing here is fitted, tuned or approximated in the browser.

  if (type === 'matern' && nu === 1.5) {

      return (1 + s) * Math.exp(-s);

    return (d) => {
      const s = Math.sqrt(5) * d;
      return (1 + s + (s * s) / 3) * Math.exp(-s);
    };

class GaussianProcess {

    this.n = this.X.length;
    this.d = this.X[0].length;
    if (ex.alpha.length !== this.n || ex.L.length !== this.n) throw new Error('GP export: inconsistent sizes');

// ANALYTICAL: used only to turn an altitude into an ambient pressure.

  [0, 288.15, -0.0065, 101325],
  [11000, 216.65, 0, 22632.06],
  [20000, 216.65, 0.001, 5474.889],
  [32000, 228.65, 0.0028, 868.0187],
  [47000, 270.65, 0, 110.9063],
  [51000, 270.65, -0.0028, 66.93887],
  [71000, 214.65, -0.002, 3.95642],

// 1-D isentropic, calorically perfect ideal gas (frozen gamma).
// These are ANALYTICAL relations: exact under their assumptions, so no
// uncertainty is attached to them anywhere in the app.

const G0 = 9.80665; // standard gravity [m/s^2]

/** Vandenkerckhove function Gamma(gamma). */
function Gamma(g) {
  return Math.sqrt(g) * Math.pow(2 / (g + 1), (g + 1) / (2 * (g - 1)));
}

/** Ideal characteristic velocity c* = sqrt(R Tc) / Gamma(gamma)  [m/s]. */
function cstarIdeal(g, R, Tc) {
  return Math.sqrt(R * Tc) / Gamma(g);
}

/** Area ratio A/A* at Mach M. */
function areaRatio(M, g) {
  return (1 / M) * Math.pow((2 / (g + 1)) * (1 + 0.5 * (g - 1) * M * M), (g + 1) / (2 * (g - 1)));
}

/** Supersonic Mach number for a given area ratio (bisection, as nozzle_contour.mach_from_area). */
function machFromArea(eps, g) {
  if (!(eps > 1)) return 1;
  let lo = 1 + 1e-12;
  let hi = 100;
  for (let i = 0; i < 200; i++) {
    const mid = 0.5 * (lo + hi);
    if (areaRatio(mid, g) > eps) hi = mid;
    else lo = mid;
  }
  return 0.5 * (lo + hi);
}

/** Static-to-stagnation pressure ratio p/p0 at Mach M. */
function pressureRatio(M, g) {
  return Math.pow(1 + 0.5 * (g - 1) * M * M, -g / (g - 1));
}

/** Exit Mach and Pe/Pc for an ideal nozzle of area ratio eps. */
function exitState(eps, g) {
  const Me = machFromArea(eps, g);
  return { Me, PePc: pressureRatio(Me, g) };
}

/** Ideal vacuum thrust coefficient (momentum + pressure thrust, Pa = 0). */
function cfVacIdeal(eps, g) {
  const { PePc } = exitState(eps, g);

// Display units. Everything inside the app is SI; this module converts only
// at the edges (rendering and input parsing) and always shows the unit.

const U = {
  SI: {
    force: { u: 'N', k: 1, d: 1 },
    forceBig: { u: 'kN', k: 1e3, d: 3 },
    pressure: { u: 'MPa', k: 1e6, d: 3 },
    pressureSmall: { u: 'kPa', k: 1e3, d: 2 },
    length: { u: 'mm', k: 1e-3, d: 2 },
    area: { u: 'mm²', k: 1e-6, d: 1 },
    isp: { u: 's', k: 1, d: 1 },
    mdot: { u: 'kg/s', k: 1, d: 4 },
    velocity: { u: 'm/s', k: 1, d: 1 },
    temperature: { u: 'K', k: 1, d: 0 },
    ratio: { u: '', k: 1, d: 4 },
  },
  US: {
    force: { u: 'lbf', k: 4.4482216152605, d: 1 },
    forceBig: { u: 'klbf', k: 4448.2216152605, d: 3 },
    pressure: { u: 'psi', k: 6894.757293168, d: 1 },
    pressureSmall: { u: 'psi', k: 6894.757293168, d: 3 },
    length: { u: 'in', k: 0.0254, d: 3 },
    area: { u: 'in²', k: 0.00064516, d: 3 },
    isp: { u: 's', k: 1, d: 1 },
    mdot: { u: 'lb/s', k: 0.45359237, d: 4 },
    velocity: { u: 'ft/s', k: 0.3048, d: 1 },
    temperature: { u: '°R', k: 1 / 1.8, d: 0 },
    ratio: { u: '', k: 1, d: 4 },
  },

function spec(qty, si, system) {
  const s = U[system] ?? U.SI;
  if (qty === 'force') return Math.abs(si) >= 1000 ? s.forceBig : s.force;
  if (qty === 'pressure') return Math.abs(si) >= (system === 'US' ? 6.9e6 : 1e6) ? s.pressure : s.pressureSmall;
  return s[qty] ?? s.ratio;
}

/** SI value -> { value, unit, text } in the chosen system. */
